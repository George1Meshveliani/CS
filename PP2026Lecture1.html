<style>
  :root{
    --bg:#EDEFF0; --surface:#FFFFFF; --border:#D3D7DA;
    --text:#1A1E27; --text-dim:#5B6270;
    --accent:#D9720C; --accent-text:#9C5209; --accent-2:#1F6B63;
    --on-accent:#1B1000;
    --font-display:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10131C; --surface:#171B27; --border:#2B3040;
      --text:#E7E9EE; --text-dim:#9AA1B0;
      --accent:#F2A340; --accent-text:#F2A340; --accent-2:#6FD6CB;
      --on-accent:#1B1000;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131C; --surface:#171B27; --border:#2B3040;
    --text:#E7E9EE; --text-dim:#9AA1B0;
    --accent:#F2A340; --accent-text:#F2A340; --accent-2:#6FD6CB;
    --on-accent:#1B1000;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-display);
    background-image:
      radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size:26px 26px;
  }
  .deck{ position:relative; height:100vh; height:100dvh; min-height:520px; display:flex; flex-direction:column; }

  .progress-rail{ height:3px; background:var(--border); flex:0 0 auto; }
  .progress-fill{ height:100%; width:0%; background:var(--accent); transition:width .3s ease; }

  .deck-chrome{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:.85rem clamp(1rem,3vw,2.2rem); border-bottom:1px solid var(--border);
  }
  .brand{ font-family:var(--font-mono); font-weight:600; font-size:.85rem; letter-spacing:.02em; }
  .brand em{ font-style:normal; color:var(--accent-text); }
  .brand .sep{ color:var(--text-dim); margin:0 .35em; }
  .slide-meta{ font-family:var(--font-mono); font-size:.8rem; color:var(--text-dim); display:flex; gap:.6em; align-items:center; font-variant-numeric:tabular-nums; }
  #partLabel{ color:var(--accent-text); font-weight:600; }

  .stage{ position:relative; flex:1 1 auto; overflow:hidden; }
  .slide{
    position:absolute; inset:0; display:flex; justify-content:center; align-items:stretch;
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .28s ease, transform .28s ease;
  }
  .slide.is-active{ opacity:1; pointer-events:auto; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){ .slide{ transition:none; transform:none; } }

  .slide-inner{
    width:100%; max-width:980px; margin:0 auto; padding:clamp(1.2rem,3vw,2.6rem) clamp(1.2rem,4vw,2rem);
    overflow-y:auto; display:flex; flex-direction:column; justify-content:center; gap:.9rem;
  }
  .slide-inner::-webkit-scrollbar{ width:8px; }
  .slide-inner::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .eyebrow{
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.14em;
    font-size:.72rem; font-weight:600; color:var(--accent-text); margin:0;
  }
  .eyebrow::before{ content:"// "; color:var(--text-dim); }

  .slide-title{ font-size:clamp(1.5rem,1.05rem+1.7vw,2.15rem); font-weight:700; line-height:1.12; margin:0; text-wrap:balance; }
  .slide-title.is-hero{ font-size:clamp(2rem,1.1rem+3.4vw,3.5rem); letter-spacing:-.01em; }
  .slide-sub{ font-size:1.02rem; color:var(--text-dim); max-width:62ch; margin:0; line-height:1.55; }

  .prose{ max-width:66ch; font-size:1rem; line-height:1.6; color:var(--text); }
  .prose strong{ color:var(--text); }

  ul.list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.55rem; max-width:66ch; }
  ul.list li{ padding-left:1.3em; position:relative; line-height:1.5; }
  ul.list li::before{ content:"›"; position:absolute; left:0; color:var(--accent); font-weight:700; font-family:var(--font-mono); }
  ul.list b{ color:var(--text); }

  code{ font-family:var(--font-mono); background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:.08em .35em; font-size:.9em; }

  /* title slide */
  .hero-tags{ display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.4rem; }
  .hero-tag{ font-family:var(--font-mono); font-size:.78rem; padding:.35em .75em; border:1px solid var(--border); border-radius:3px; color:var(--text-dim); }
  .cursor{ display:inline-block; width:.55em; height:1em; background:var(--accent); vertical-align:-.15em; animation:blink 1.1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce){ .cursor{ animation:none; } }
  @keyframes blink{ 50%{ opacity:0; } }
  .hint-line{ font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim); margin-top:.6rem; }

  /* divider */
  .divider-wrap{ display:flex; flex-direction:column; gap:.3rem; }
  .part-number{ font-family:var(--font-mono); font-size:clamp(3.5rem,2rem+7vw,7rem); font-weight:700; color:var(--accent); line-height:1; letter-spacing:-.02em; }
  .divider-wrap .slide-title{ font-size:clamp(1.6rem,1.1rem+2vw,2.4rem); }

  /* timeline */
  .timeline{ list-style:none; margin:0; padding:0; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:1rem; max-width:70ch; }
  .timeline li{ padding-left:1.2rem; position:relative; }
  .timeline li::before{ content:""; position:absolute; left:-6px; top:.35em; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
  .timeline .year{ font-family:var(--font-mono); color:var(--accent-text); font-weight:700; font-size:.85rem; font-variant-numeric:tabular-nums; }
  .timeline .event{ font-weight:600; margin:.1em 0; }
  .timeline .desc{ color:var(--text-dim); font-size:.92rem; line-height:1.45; }

  /* split */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; }
  @media (max-width:640px){ .cols{ grid-template-columns:1fr; } }
  .col{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1.1rem 1.2rem; }
  .col h3{ margin:0 0 .6rem; font-size:.95rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--accent-2); }
  .col ul.list li::before{ color:var(--accent-2); }

  /* math table */
  .place-table{ border-collapse:collapse; font-family:var(--font-mono); font-size:.92rem; font-variant-numeric:tabular-nums; }
  .place-table td,.place-table th{ border:1px solid var(--border); padding:.4em .7em; text-align:center; }
  .place-table th{ color:var(--text-dim); font-weight:600; }
  .place-table .hi{ color:var(--accent-text); font-weight:700; }
  .worked{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.9rem 1.1rem; font-family:var(--font-mono); font-size:.92rem; line-height:1.6; max-width:66ch; overflow-x:auto; }
  .worked mjx-container{ font-size:105%; }

  /* problems */
  .problem{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:4px; padding:.9rem 1.1rem; }
  .problem + .problem{ margin-top:.7rem; }
  .problem-q{ font-family:var(--font-mono); font-size:.95rem; }
  .problem-q .prompt{ color:var(--accent-text); margin-right:.4em; }
  .problem-actions{ display:flex; gap:.5rem; margin-top:.6rem; }
  .reveal-btn{
    font-family:var(--font-mono); font-size:.78rem; background:transparent; color:var(--accent-text);
    border:1px solid var(--accent); border-radius:3px; padding:.35em .8em; cursor:pointer;
  }
  .reveal-btn:hover{ background:var(--accent); color:var(--on-accent); }
  .reveal-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .reveal{ margin-top:.6rem; padding:.6rem .8rem; background:var(--bg); border:1px dashed var(--border); border-radius:3px; font-family:var(--font-mono); font-size:.87rem; line-height:1.55; }
  .reveal[hidden]{ display:none; }
  .reveal-tag{ color:var(--accent-2); font-weight:700; margin-right:.5em; }

  /* tools grid */
  .tool-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1rem; }
  .tool-card{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.3rem; }
  .tool-tag{ font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); }
  .tool-card h3{ margin:0; font-size:1.05rem; }
  .tool-card p{ margin:0; color:var(--text-dim); font-size:.9rem; line-height:1.45; }

  .callout{ border-left:3px solid var(--accent-2); padding:.5rem .9rem; color:var(--text-dim); font-size:.92rem; font-style:normal; max-width:62ch; }

  /* nav */
  .nav-zone{ position:absolute; top:0; bottom:0; width:56px; background:transparent; border:0; cursor:pointer; z-index:2; }
  .nav-zone:focus-visible{ outline:2px solid var(--accent); outline-offset:-4px; }
  .nav-prev{ left:0; } .nav-next{ right:0; }
  @media (max-width:700px){ .nav-zone{ width:34px; } }

  .deck-controls{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:.7rem clamp(1rem,3vw,2.2rem); border-top:1px solid var(--border); background:var(--bg);
  }
  .ctrl-btn{
    font-family:var(--font-mono); font-size:.85rem; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:4px; padding:.5em 1em; cursor:pointer;
  }
  .ctrl-btn:hover{ border-color:var(--accent); color:var(--accent-text); }
  .ctrl-btn:disabled{ opacity:.35; cursor:default; }
  .ctrl-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .dots{ display:flex; gap:.9rem; overflow-x:auto; max-width:60vw; padding:.2rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--border); border:0; padding:0; cursor:pointer; flex:0 0 auto; }
  .dot.is-current{ background:var(--accent); transform:scale(1.35); }
  .dot:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* case studies */
  .case-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1rem; }
  .case-card{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:4px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.35rem; }
  .case-card .case-year{ font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); }
  .case-card h3{ margin:0; font-size:1rem; }
  .case-card p{ margin:0; font-size:.88rem; color:var(--text-dim); line-height:1.45; }
  .case-card .result{ font-family:var(--font-mono); font-size:.78rem; color:var(--accent-2); margin:0; }

  /* formulas */
  .formula{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.85rem 1.1rem; overflow-x:auto; }
  .formula .f-label{ display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); margin-bottom:.35rem; font-family:var(--font-mono); }
  .formula .f-expr{ color:var(--text); overflow-x:auto; }
  .formula .f-expr mjx-container{ font-size:112%; }

  /* terminal */
  .terminal{ background:#0B0D12; border:1px solid #262B36; border-radius:6px; overflow:hidden; font-family:var(--font-mono); font-size:.85rem; }
  .terminal-bar{ display:flex; align-items:center; gap:.4rem; padding:.5rem .7rem; background:#151923; }
  .terminal-title{ margin-left:.5rem; font-size:.72rem; color:#7C8494; }
  .terminal-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .terminal-dot.red{ background:#E4626F; } .terminal-dot.yellow{ background:#E8B95F; } .terminal-dot.green{ background:#66C08A; }
  .terminal-body{ padding:.8rem 1rem; display:flex; flex-direction:column; gap:.15rem; }
  .terminal-body .cmd{ color:#D7DBE0; }
  .terminal-body .cmd::before{ content:"$ "; color:#6FD6CB; }
  .terminal-body .out{ color:#7C8494; }

  /* code blocks */
  .code-block{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.8rem 1rem; font-family:var(--font-mono); font-size:.85rem; line-height:1.55; overflow-x:auto; white-space:pre; color:var(--text); margin:0; }

  /* bitwise lab (interactive + static examples) */
  .bitlab{ display:flex; flex-direction:column; gap:.6rem; }
  .bitlab-row{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
  .bitlab-row.result{ border-top:1px dashed var(--border); padding-top:.6rem; margin-top:.1rem; }
  .bitlab-label{ font-family:var(--font-mono); font-weight:700; min-width:1.6em; color:var(--text-dim); }
  .bitgrid{ display:flex; gap:.3rem; }
  .bit-cell{ width:2.1rem; height:2.1rem; display:flex; align-items:center; justify-content:center; border-radius:4px; border:1px solid var(--border); background:var(--bg); color:var(--text-dim); font-family:var(--font-mono); font-size:1rem; font-weight:700; cursor:pointer; transition:background .15s,color .15s; }
  .bit-cell.is-on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .bit-cell:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .bitgrid.readonly .bit-cell{ cursor:default; }
  .bitlab-dec{ font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); margin-left:auto; }
  .bitlab-ops{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .op-btn{ font-family:var(--font-mono); font-size:.82rem; padding:.4em .9em; border:1px solid var(--border); border-radius:4px; background:var(--surface); color:var(--text); cursor:pointer; }
  .op-btn.is-active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .op-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* memory map diagram */
  .memmap{ display:flex; flex-direction:column; border:1px solid var(--border); border-radius:6px; overflow:hidden; max-width:480px; }
  .memseg{ display:flex; justify-content:space-between; align-items:baseline; gap:.8rem; padding:.65rem .9rem; font-family:var(--font-mono); font-size:.82rem; border-top:1px solid var(--border); background:var(--surface); }
  .memmap .memseg:first-child{ border-top:0; }
  .memseg-label{ font-weight:700; }
  .memseg-note{ color:var(--text-dim); font-size:.78rem; text-align:right; }
  .memseg.bss, .memseg.data, .memseg.text{ background:var(--bg); }
  .memmap-gap{ padding:.45rem .9rem; text-align:center; font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); border-top:1px solid var(--border); font-style:italic; }

  /* memory bytes / pointer visualization */
  .membytes{ display:flex; gap:.4rem; flex-wrap:wrap; }
  .mbyte{ display:flex; flex-direction:column; align-items:center; border:1px solid var(--border); border-radius:4px; padding:.4rem .6rem; background:var(--surface); font-family:var(--font-mono); }
  .mbyte-addr{ font-size:.68rem; color:var(--text-dim); }
  .mbyte-val{ font-size:1rem; font-weight:700; margin-top:.15rem; }
  .mbyte.is-target{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .mbyte.is-target .mbyte-val{ color:var(--accent-text); }

  /* color swatch */
  .swatch{ width:56px; height:56px; border-radius:6px; border:1px solid var(--border); flex:0 0 auto; }
</style>
</head>

<script>
(function(){
  function bitCells(value, opts){
    opts = opts || {};
    var tag = opts.tag || 'span';
    var group = opts.group || '';
    var weights = [128,64,32,16,8,4,2,1];
    var out = '';
    for (var k = 0; k < weights.length; k++){
      var w = weights[k];
      var on = (value & w) ? 1 : 0;
      var cls = 'bit-cell' + (on ? ' is-on' : '');
      var groupAttr = group ? ' data-group="' + group + '"' : '';
      out += '<' + tag + ' class="' + cls + '" data-weight="' + w + '"' + groupAttr + '>' + on + '</' + tag + '>';
    }
    return out;
  }

  const slides = [
    { part:0, variant:'title', title:'C, Paradigms &amp; the Bits Underneath', html:`
      <p class="eyebrow">root@PP2026:~$ ./lecture_01 --init<span class="cursor"></span></p>
      <p class="slide-sub">C, the procedural paradigm, and the bits underneath everything &mdash; where "Programming Paradigms" starts.</p>
      <div class="hero-tags">
        <span class="hero-tag">Part 1 · C &amp; Paradigms</span>
        <span class="hero-tag">Part 2 · Bits, Bytes &amp; Memory</span>
        <span class="hero-tag">Part 3 · Bitwise Operators</span>
        <span class="hero-tag">Part 4 · Your Toolkit</span>
      </div>
      <p class="hint-line">Use ← → , tap the left/right edges, or the dots below to move.</p>
    `},
    { part:1, variant:'divider', kicker:'01', title:'Introduction to C &amp; The Procedural Paradigm', html:`
      <p class="prose">Where this course starts: one language, one paradigm, and the machine underneath it.</p>
    `},
    { part:1, eyebrow:'Part 1 · Foundations', title:'What Is a Programming Paradigm?', html:`
      <p class="prose">A <b>paradigm</b> is a style &mdash; a lens &mdash; for organizing how a program is built. The same problem looks different through each one:</p>
      <ul class="list">
        <li><b>Procedural / Imperative</b> (C) &mdash; a recipe: explicit steps that change state</li>
        <li><b>Object-Oriented</b> (C++, Java) &mdash; bundle data and behavior together into objects</li>
        <li><b>Functional</b> (Haskell, parts of Python/JS) &mdash; compute new values, never mutate old ones</li>
        <li><b>Declarative</b> (SQL, regex) &mdash; describe <i>what</i> you want, not <i>how</i> to get it</li>
      </ul>
      <p class="callout">This course is about learning to recognize &mdash; and choose &mdash; the right lens for a problem. We start with C's lens: procedural.</p>
    `},
    { part:1, eyebrow:'Part 1 · History', title:'Where C Came From', html:`
      <ul class="timeline">
        <li><span class="year">1969</span><div class="event">B &mdash; Ken Thompson</div><div class="desc">A simple, typeless language at Bell Labs &mdash; C's direct ancestor.</div></li>
        <li><span class="year">1972</span><div class="event">C &mdash; Dennis Ritchie</div><div class="desc">Adds types and structs to B, built at Bell Labs to write system software.</div></li>
        <li><span class="year">1973</span><div class="event">Unix Rewritten in C</div><div class="desc">The Unix kernel is rewritten in C &mdash; suddenly an OS could be ported to new hardware.</div></li>
        <li><span class="year">1978</span><div class="event">"K&amp;R C"</div><div class="desc">Kernighan &amp; Ritchie's book becomes the de facto language standard for a decade.</div></li>
        <li><span class="year">1989 → 2011</span><div class="event">ANSI C89 → C99 → C11</div><div class="desc">The language is formally standardized, then modernized in stages.</div></li>
        <li><span class="year">Today</span><div class="event">Still Everywhere</div><div class="desc">The Linux kernel, most other language runtimes, and nearly all embedded systems are C.</div></li>
      </ul>
    `},
    { part:1, eyebrow:'Part 1 · Paradigm Check', title:'C Is Function-Structured &mdash; Not Functional', html:`
      <p class="prose">C organizes programs into <b>functions</b>, which is why people loosely call it "functional." That's different from the <b>Functional Programming</b> paradigm you'll meet later in this course.</p>
      <div class="cols">
        <div class="col"><h3>C: Procedural / Imperative</h3>
          <pre class="code-block">int sum = 0;
for (int i = 1; i &lt;= n; i++) {
    sum += i;
}</pre>
          <p style="margin:.6rem 0 0;color:var(--text-dim);font-size:.85rem">Explicit steps. A variable that <i>mutates</i>. Order matters.</p>
        </div>
        <div class="col"><h3>True Functional Style</h3>
          <pre class="code-block">sum xs = foldr (+) 0 xs
-- no mutation, no loops</pre>
          <p style="margin:.6rem 0 0;color:var(--text-dim);font-size:.85rem">A new value is computed from old ones. Nothing changes in place.</p>
        </div>
      </div>
      <p class="callout">C's paradigm is <b>procedural</b>: a program is a sequence of instructions that change state, step by step.</p>
    `},
    { part:1, eyebrow:'Part 1 · Real Impact', title:'C in Action: Three Real Results', html:`
      <div class="case-grid">
        <div class="case-card"><span class="case-year">1973</span><h3>Unix Rewritten in C</h3><p>Ken Thompson and Dennis Ritchie rewrote the Unix kernel in C instead of assembly.</p><p class="result">Result: Unix became portable across hardware &mdash; the idea of a portable OS was born.</p></div>
        <div class="case-card"><span class="case-year">1991</span><h3>The Linux Kernel</h3><p>Linus Torvalds started Linux &mdash; still roughly 30 million lines of C today.</p><p class="result">Result: runs most servers, all Android phones, and much of the internet's infrastructure.</p></div>
        <div class="case-card"><span class="case-year">Ongoing</span><h3>Embedded &amp; Space Systems</h3><p>Car ECUs, pacemakers, and spacecraft flight software are almost always written in C.</p><p class="result">Result: still the default wherever memory and timing must be exactly predictable.</p></div>
      </div>
    `},
    { part:2, variant:'divider', kicker:'02', title:'Bits, Bytes &amp; Memory', html:`
      <p class="prose">The raw material every C program is built from.</p>
    `},
    { part:2, eyebrow:'Part 2 · Units', title:'Bits, Nibbles &amp; Bytes', html:`
      <p class="prose">The basic units everything else is built from:</p>
      <table class="place-table">
        <tr><th>unit</th><th>bits</th><th>distinct values</th></tr>
        <tr><td>bit</td><td>1</td><td>2</td></tr>
        <tr><td>nibble</td><td>4</td><td>16</td></tr>
        <tr><td>byte</td><td>8</td><td class="hi">256</td></tr>
        <tr><td>word (64-bit CPU)</td><td>64</td><td>2⁶⁴ (~1.8×10¹⁹)</td></tr>
      </table>
      <div class="formula"><span class="f-label">A byte, formally</span><div class="f-expr">\\[ 1\\ \\text{byte} = 8\\ \\text{bits} \\;\\Rightarrow\\; 2^{8} = 256 \\text{ distinct values} \\]</div></div>
      <div class="formula"><span class="f-label">Bigger units (powers of 1024)</span><div class="f-expr">\\[ 1\\text{ KB}=2^{10}\\text{B}, \\quad 1\\text{ MB}=2^{20}\\text{B}, \\quad 1\\text{ GB}=2^{30}\\text{B} \\]</div></div>
    `},
    { part:2, eyebrow:'Part 2 · Layout', title:"A C Program's Memory Map", html:`
      <p class="prose">When your program runs, the OS lays its memory out in predictable regions:</p>
      <div class="memmap">
        <div class="memseg stack"><span class="memseg-label">Stack ↓</span><span class="memseg-note">local variables, function calls</span></div>
        <div class="memmap-gap">free space</div>
        <div class="memseg heap"><span class="memseg-label">Heap ↑</span><span class="memseg-note">malloc/free, grows on demand</span></div>
        <div class="memseg bss"><span class="memseg-label">BSS</span><span class="memseg-note">uninitialized globals/statics</span></div>
        <div class="memseg data"><span class="memseg-label">Data</span><span class="memseg-note">initialized globals/statics</span></div>
        <div class="memseg text"><span class="memseg-label">Text / Code</span><span class="memseg-note">compiled instructions (read-only)</span></div>
      </div>
      <p class="prose" style="font-size:.85rem;color:var(--text-dim)">High addresses at the top, low addresses at the bottom &mdash; the stack and heap grow toward each other.</p>
    `},
    { part:2, eyebrow:'Part 2 · Pointers', title:'Addresses &amp; Pointers', html:`
      <p class="prose">A pointer doesn't store a value &mdash; it stores an <b>address</b>. Here's a slice of memory, with one byte pointed to:</p>
      <div class="membytes">
        <div class="mbyte"><span class="mbyte-addr">0x1000</span><span class="mbyte-val">05</span></div>
        <div class="mbyte"><span class="mbyte-addr">0x1001</span><span class="mbyte-val">12</span></div>
        <div class="mbyte is-target"><span class="mbyte-addr">0x1002</span><span class="mbyte-val">FF</span></div>
        <div class="mbyte"><span class="mbyte-addr">0x1003</span><span class="mbyte-val">08</span></div>
      </div>
      <div class="worked">int *ptr = &amp;arr[2];   // ptr holds the address 0x1002<br>*ptr;              // dereference &rarr; reads 0xFF</div>
    `},
    { part:3, variant:'divider', kicker:'03', title:'Bitwise Operators', html:`
      <p class="prose">Working directly on the bits inside a byte &mdash; the fastest, most literal way to manipulate data.</p>
    `},
    { part:3, eyebrow:'Part 3 · Reference', title:'The Six Operators, At a Glance', html:`
      <table class="place-table">
        <tr><th>symbol</th><th>C syntax</th><th>name</th><th>example (a=12, b=10)</th></tr>
        <tr><td>∧</td><td>&amp;</td><td>AND</td><td>a &amp; b = 8</td></tr>
        <tr><td>∨</td><td>|</td><td>OR</td><td>a | b = 14</td></tr>
        <tr><td>⊕</td><td>^</td><td>XOR</td><td>a ^ b = 6</td></tr>
        <tr><td>¬</td><td>~</td><td>NOT</td><td>~a (8-bit) = 243</td></tr>
        <tr><td>≪</td><td>&lt;&lt;</td><td>Left shift</td><td>a &lt;&lt; 1 = 24</td></tr>
        <tr><td>≫</td><td>&gt;&gt;</td><td>Right shift</td><td>a &gt;&gt; 1 = 6</td></tr>
      </table>
      <div class="formula"><span class="f-label">All six, at a glance</span><div class="f-expr">\\[ A\\wedge B, \\quad A\\vee B, \\quad A\\oplus B, \\quad \\neg A, \\quad A\\ll k, \\quad A\\gg k \\]</div></div>
    `},
    { part:3, eyebrow:'Part 3 · AND', title:'AND &mdash; Masking Bits Off', html:`
      <p class="prose">AND keeps a bit only where <b>both</b> inputs have a 1 &mdash; it's how you <b>mask</b> (clear) bits.</p>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row"><span class="bitlab-label">∧</span><div class="bitgrid readonly">${bitCells(10)}</div><span class="bitlab-dec">10</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">=</span><div class="bitgrid readonly">${bitCells(12 & 10)}</div><span class="bitlab-dec">${12 & 10}</span></div>
      </div>
      <p class="prose" style="font-size:.9rem">Real use: <code>x &amp; 0x0F</code> keeps only the low nibble; <code>flags &amp; PERM_READ</code> checks a single permission bit.</p>
    `},
    { part:3, eyebrow:'Part 3 · OR', title:'OR &mdash; Setting Bits On', html:`
      <p class="prose">OR sets a bit if <b>either</b> input has a 1 &mdash; it's how you turn bits <b>on</b>.</p>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row"><span class="bitlab-label">∨</span><div class="bitgrid readonly">${bitCells(10)}</div><span class="bitlab-dec">10</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">=</span><div class="bitgrid readonly">${bitCells(12 | 10)}</div><span class="bitlab-dec">${12 | 10}</span></div>
      </div>
      <p class="prose" style="font-size:.9rem">Real use: <code>flags | PERM_WRITE</code> grants a permission without disturbing any other bit.</p>
    `},
    { part:3, eyebrow:'Part 3 · XOR', title:'XOR &mdash; Toggling Bits', html:`
      <p class="prose">XOR is 1 exactly where the inputs <b>differ</b> &mdash; it's how you <b>toggle</b> bits.</p>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row"><span class="bitlab-label">⊕</span><div class="bitgrid readonly">${bitCells(10)}</div><span class="bitlab-dec">10</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">=</span><div class="bitgrid readonly">${bitCells(12 ^ 10)}</div><span class="bitlab-dec">${12 ^ 10}</span></div>
      </div>
      <p class="prose" style="font-size:.9rem">Famous trick &mdash; swap two variables with no temp: <code>a^=b; b^=a; a^=b;</code></p>
    `},
    { part:3, eyebrow:'Part 3 · NOT', title:'NOT &mdash; Flipping Every Bit', html:`
      <p class="prose">NOT flips every bit. Combined with +1, this is exactly how two's-complement negation works.</p>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">¬A</span><div class="bitgrid readonly">${bitCells((~12) & 0xFF)}</div><span class="bitlab-dec">${(~12) & 0xFF}</span></div>
      </div>
      <div class="formula"><span class="f-label">The two's-complement connection</span><div class="f-expr">\\[ \\neg x + 1 \\;=\\; -x \\]</div></div>
    `},
    { part:3, eyebrow:'Part 3 · Shifts', title:'Shifts &mdash; Sliding Bits', html:`
      <p class="prose">Shifting slides every bit left or right &mdash; the fastest way to multiply or divide by a power of two.</p>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">≪1</span><div class="bitgrid readonly">${bitCells((12 << 1) & 0xFF)}</div><span class="bitlab-dec">${(12 << 1) & 0xFF}</span></div>
      </div>
      <div class="bitlab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid readonly">${bitCells(12)}</div><span class="bitlab-dec">12</span></div>
        <div class="bitlab-row result"><span class="bitlab-label">≫1</span><div class="bitgrid readonly">${bitCells(12 >> 1)}</div><span class="bitlab-dec">${12 >> 1}</span></div>
      </div>
      <div class="formula"><span class="f-label">Shift ↔ multiply/divide</span><div class="f-expr">\\[ x \\ll k \\;=\\; x\\times2^{k}, \\qquad x \\gg k \\;=\\; \\left\\lfloor \\frac{x}{2^{k}} \\right\\rfloor \\]</div></div>
    `},
    { part:3, eyebrow:'Part 3 · Real Example', title:'Packing a Color into One Integer', html:`
      <p class="prose">Shifts and OR let you pack several small values into one integer &mdash; exactly how a 24-bit color works.</p>
      <div class="bitlab-row" style="align-items:center;gap:1rem">
        <div class="swatch" style="background:#FF6A00"></div>
        <div class="prose" style="font-size:.9rem;margin:0">R=255, G=106, B=0 &mdash; packed as <code>0xFF6A00</code></div>
      </div>
      <div class="formula"><span class="f-label">Packing three bytes into one integer</span><div class="f-expr">\\[ \\text{RGB} \\;=\\; (R\\ll16)\\ \\vee\\ (G\\ll8)\\ \\vee\\ B \\]</div></div>
      <pre class="code-block">int rgb = (r &lt;&lt; 16) | (g &lt;&lt; 8) | b;   // pack
int g   = (rgb &gt;&gt; 8) &amp; 0xFF;         // unpack green</pre>
    `},
    { part:3, eyebrow:'Part 3 · Simulation', title:'Bitwise Playground &mdash; Try It Yourself', html:`
      <p class="prose">Click bits to flip them, pick an operator, and watch the result update live.</p>
      <div class="bitlab" id="bitLab">
        <div class="bitlab-row"><span class="bitlab-label">A</span><div class="bitgrid" id="bitsA">${bitCells(202, {tag:'button', group:'A'})}</div><span class="bitlab-dec" id="decA">202</span></div>
        <div class="bitlab-row"><span class="bitlab-label">B</span><div class="bitgrid" id="bitsB">${bitCells(15, {tag:'button', group:'B'})}</div><span class="bitlab-dec" id="decB">15</span></div>
        <div class="bitlab-ops">
          <button class="op-btn is-active" data-op="AND">A ∧ B</button>
          <button class="op-btn" data-op="OR">A ∨ B</button>
          <button class="op-btn" data-op="XOR">A ⊕ B</button>
          <button class="op-btn" data-op="NOT">¬A</button>
          <button class="op-btn" data-op="SHL">A ≪ 1</button>
          <button class="op-btn" data-op="SHR">A ≫ 1</button>
        </div>
        <div class="bitlab-row result"><span class="bitlab-label">=</span><div class="bitgrid readonly" id="bitsR">${bitCells(202 & 15, {group:'R'})}</div><span class="bitlab-dec" id="decR">10</span></div>
      </div>
    `},
    { part:3, eyebrow:'Part 3 · Try It Yourself', title:'Problems: AND &amp; OR', html:`
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q1. Compute <b>10101100</b>₂ ∧ <b>00001111</b>₂.</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb1-hint">Hint</button>
          <button class="reveal-btn" data-target="pb1-sol">Solution</button>
        </div>
        <div class="reveal" id="pb1-hint" hidden><span class="reveal-tag">HINT</span>\\(x \\wedge 00001111_2\\) keeps only the last 4 bits of \\(x\\) &mdash; this is called a mask.</div>
        <div class="reveal" id="pb1-sol" hidden><span class="reveal-tag">SOLUTION</span>\\(10101100_2 \\wedge 00001111_2 = 00001100_2 = 12\\)</div>
      </div>
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q2. Compute <b>10101100</b>₂ ∨ <b>00001111</b>₂.</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb2-hint">Hint</button>
          <button class="reveal-btn" data-target="pb2-sol">Solution</button>
        </div>
        <div class="reveal" id="pb2-hint" hidden><span class="reveal-tag">HINT</span>\\(x \\vee 00001111_2\\) forces the last 4 bits to 1, whatever they were.</div>
        <div class="reveal" id="pb2-sol" hidden><span class="reveal-tag">SOLUTION</span>\\(10101100_2 \\vee 00001111_2 = 10101111_2 = 175\\)</div>
      </div>
    `},
    { part:3, eyebrow:'Part 3 · Try It Yourself', title:'Problems: XOR &amp; Parity', html:`
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q3. Is <b>37</b> even or odd? Use a bitwise test.</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb3-hint">Hint</button>
          <button class="reveal-btn" data-target="pb3-sol">Solution</button>
        </div>
        <div class="reveal" id="pb3-hint" hidden><span class="reveal-tag">HINT</span>Compute \\(x \\wedge 1\\) &mdash; it isolates bit 0.</div>
        <div class="reveal" id="pb3-sol" hidden><span class="reveal-tag">SOLUTION</span>\\(37 = 100101_2\\), so \\(37 \\wedge 1 = 1\\) &mdash; <b>odd</b>. In general \\(x\\wedge1=0\\) means even, \\(=1\\) means odd.</div>
      </div>
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q4. Trace the classic XOR swap: <code>a^=b; b^=a; a^=b;</code> starting from <b>a=6, b=11</b>.</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb4-hint">Hint</button>
          <button class="reveal-btn" data-target="pb4-sol">Solution</button>
        </div>
        <div class="reveal" id="pb4-hint" hidden><span class="reveal-tag">HINT</span>Do it one line at a time: \\(a=a\\oplus b\\), then \\(b=b\\oplus a\\), then \\(a=a\\oplus b\\).</div>
        <div class="reveal" id="pb4-sol" hidden><span class="reveal-tag">SOLUTION</span>\\(a=6\\oplus11=13\\). \\(b=11\\oplus13=6\\). \\(a=13\\oplus6=11\\). Final: <b>a=11, b=6</b> &mdash; swapped, with no temp variable!</div>
      </div>
    `},
    { part:3, eyebrow:'Part 3 · Try It Yourself', title:'Problems: Shifts &amp; Color Packing', html:`
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q5. What is <b>5 &lt;&lt; 3</b>?</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb5-hint">Hint</button>
          <button class="reveal-btn" data-target="pb5-sol">Solution</button>
        </div>
        <div class="reveal" id="pb5-hint" hidden><span class="reveal-tag">HINT</span>\\(x \\ll k = x \\times 2^{k}\\).</div>
        <div class="reveal" id="pb5-sol" hidden><span class="reveal-tag">SOLUTION</span>\\(5 \\ll 3 = 5 \\times 2^{3} = 40\\)</div>
      </div>
      <div class="problem">
        <div class="problem-q"><span class="prompt">&gt;</span> Q6. The color <code>0xFF6A00</code> packs (R,G,B) into one integer. Extract the <b>green</b> channel.</div>
        <div class="problem-actions">
          <button class="reveal-btn" data-target="pb6-hint">Hint</button>
          <button class="reveal-btn" data-target="pb6-sol">Solution</button>
        </div>
        <div class="reveal" id="pb6-hint" hidden><span class="reveal-tag">HINT</span>Shift right to drop the blue byte, then mask with \\(\\text{0xFF}\\): \\((\\text{RGB}\\gg8)\\wedge\\text{0xFF}\\).</div>
        <div class="reveal" id="pb6-sol" hidden><span class="reveal-tag">SOLUTION</span>\\((\\text{0xFF6A00}\\gg8)\\wedge\\text{0xFF} = \\text{0x6A} = 106\\) &mdash; the green channel.</div>
      </div>
    `},
    { part:4, variant:'divider', kicker:'04', title:'Your Toolkit for This Course', html:`

  const stage = document.getElementById('stage');
  const dotsWrap = document.getElementById('dots');
  const counter = document.getElementById('counter');
  const partLabel = document.getElementById('partLabel');
  const progressFill = document.getElementById('progressFill');
  const total = slides.length;
  let current = 0;

  slides.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    el.dataset.index = i;
    let inner = '<div class="slide-inner">';
    if (s.variant === 'divider') {
      inner += `<div class="divider-wrap"><p class="eyebrow">Part ${s.kicker}</p><div class="part-number">${s.kicker}</div><h2 class="slide-title">${s.title}</h2></div>`;
    } else {
      if (s.eyebrow) inner += `<p class="eyebrow">${s.eyebrow}</p>`;
      if (s.title) inner += `<h2 class="slide-title${s.variant === 'title' ? ' is-hero' : ''}">${s.title}</h2>`;
    }
    inner += s.html + '</div>';
    el.innerHTML = inner;
    stage.appendChild(el);
  });

  const dotEls = [];
  slides.forEach((s, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
    dot.addEventListener('click', () => go(i));
    dotsWrap.appendChild(dot);
    dotEls.push(dot);
  });

  function partName(p) {
    return p === 0 ? 'Lecture 1' : 'Part ' + p;
  }

  function render() {
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.classList.toggle('is-active', i === current);
    });
    dotEls.forEach((d, i) => d.classList.toggle('is-current', i === current));
    counter.textContent = String(current + 1).padStart(2, '0') + ' / ' + total;
    partLabel.textContent = partName(slides[current].part);
    progressFill.style.width = ((current) / (total - 1)) * 100 + '%';
    document.getElementById('btnPrev').disabled = current === 0;
    document.getElementById('btnNext').disabled = current === total - 1;
    dotEls[current].scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function go(i) {
    current = Math.max(0, Math.min(total - 1, i));
    render();
  }

  document.getElementById('btnPrev').addEventListener('click', () => go(current - 1));
  document.getElementById('btnNext').addEventListener('click', () => go(current + 1));
  document.getElementById('prevZone').addEventListener('click', () => go(current - 1));
  document.getElementById('nextZone').addEventListener('click', () => go(current + 1));

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { go(current + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { go(current - 1); e.preventDefault(); }
  });

  stage.addEventListener('click', (e) => {
    const btn = e.target.closest('.reveal-btn');
    if (!btn) return;
    const panel = document.getElementById(btn.dataset.target);
    if (!panel) return;
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    panel.hidden = !panel.hidden;
    btn.textContent = panel.hidden ? btn.dataset.label : 'Hide ' + btn.dataset.label;
  });

  function initBitLab() {
    const root = document.getElementById('bitLab');
    if (!root) return;
    const cellsA = root.querySelectorAll('.bit-cell[data-group="A"]');
    const cellsB = root.querySelectorAll('.bit-cell[data-group="B"]');
    const cellsR = root.querySelectorAll('.bit-cell[data-group="R"]');
    const opBtns = root.querySelectorAll('.op-btn');
    const decA = document.getElementById('decA');
    const decB = document.getElementById('decB');
    const decR = document.getElementById('decR');
    let currentOp = 'AND';

    function valueOf(cells) {
      let sum = 0;
      cells.forEach((c) => { if (c.textContent === '1') sum += parseInt(c.dataset.weight, 10); });
      return sum;
    }
    function hex(n) { return '0x' + n.toString(16).toUpperCase().padStart(2, '0'); }
    function compute() {
      const a = valueOf(cellsA);
      const b = valueOf(cellsB);
      let r = 0;
      if (currentOp === 'AND') r = a & b;
      else if (currentOp === 'OR') r = a | b;
      else if (currentOp === 'XOR') r = a ^ b;
      else if (currentOp === 'NOT') r = (~a) & 0xFF;
      else if (currentOp === 'SHL') r = (a << 1) & 0xFF;
      else if (currentOp === 'SHR') r = a >> 1;
      decA.textContent = a + ' (' + hex(a) + ')';
      decB.textContent = b + ' (' + hex(b) + ')';
      decR.textContent = r + ' (' + hex(r) + ')';
      cellsR.forEach((cell) => {
        const w = parseInt(cell.dataset.weight, 10);
        const on = (r & w) ? true : false;
        cell.textContent = on ? '1' : '0';
        cell.classList.toggle('is-on', on);
      });
    }
    function wireToggle(cell) {
      cell.addEventListener('click', () => {
        const on = cell.textContent !== '1';
        cell.textContent = on ? '1' : '0';
        cell.classList.toggle('is-on', on);
        compute();
      });
    }
    cellsA.forEach(wireToggle);
    cellsB.forEach(wireToggle);
    opBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        opBtns.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        currentOp = btn.dataset.op;
        compute();
      });
    });
    compute();
  }

  render();
  initBitLab();

  (function typesetMath(){
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise();
    } else {
      setTimeout(typesetMath, 60);
    }
  })();
})();
</script>
</body>
</html>
